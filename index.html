<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Craquage by Kiabi</title>
<meta name="description" content="Swipe les articles Kiabi : Go ou No go, change de couleur, garde tes coups de cœur et achète en un clic.">
<meta name="theme-color" content="#040037">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Craquage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.kiabi.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Charte Kiabi : bleu nuit #040037, rouge promo #ED2237, gris clairs, Barlow (titres) + Roboto (texte), boutons pilule. */
:root {
  --ink: #040037; --red: #ed2237; --bg: #f2f2f5; --surface: #ffffff; --line: #e6e6eb; --muted: #66657d; --soft: #b3b2c2;
  --yes: #040037; --no: #040037;
  --shadow: 0 14px 34px -16px rgba(4, 0, 55, .35);
  --font-display: "Barlow", "Arial Narrow", Arial, sans-serif;
  --font-body: "Roboto", Arial, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%;
}
button, a { touch-action: manipulation; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; }

/* ---------- En-tête ---------- */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -.01em; line-height: 1; }
.brand span { font-family: var(--font-display); font-weight: 500; font-size: .85rem; color: var(--muted); }
.brand img { height: 24px; width: auto; align-self: center; }
.coll-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.coll-btn svg { width: 22px; height: 22px; color: var(--ink); }
.coll-btn .badge { position: absolute; top: -2px; right: -4px; }
.badge { background: var(--red); color: #fff; border-radius: 50px; min-width: 22px; padding: 2px 7px; font-size: .78rem; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--font-body); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 50px; padding: 7px 14px;
  font-family: var(--font-display); font-weight: 600; font-size: .9rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.deal { color: var(--red); border-color: var(--red); }
.chip.deal[aria-pressed="true"] { background: var(--red); color: #fff; }

/* ---------- Cartes ---------- */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; container-type: size; }
.deck { --info: 104px; --w: min(100cqw, calc((100cqh - var(--info)) * .75), 460px); position: relative; width: var(--w); height: calc(var(--w) * 4 / 3 + var(--info)); max-width: 100%; }
.card { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow);
  touch-action: none; user-select: none; will-change: transform; display: flex; flex-direction: column; }
.card .photo { position: relative; width: 100%; aspect-ratio: 3 / 4; flex-shrink: 0; background: var(--line); }
.card .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; pointer-events: none; -webkit-user-drag: none; }
.photo.loading::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.6) 50%, transparent 70%) var(--line);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -80% 0; } }
.segs { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 4px; z-index: 2; pointer-events: none; }
.segs i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .5); box-shadow: 0 0 2px rgba(4,0,55,.25); }
.segs i.on { background: #fff; }
.promo { position: absolute; top: 18px; left: 12px; background: var(--red); color: #fff; font-family: var(--font-display); font-size: .85rem; font-weight: 700;
  padding: 3px 9px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.stars { position: absolute; top: 18px; right: 12px; background: var(--surface); color: var(--ink); font-size: .75rem; font-weight: 500; padding: 3px 8px; border-radius: 50px; }
.tap-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(4, 0, 55, .78); color: #fff; font-size: .75rem;
  padding: 5px 11px; border-radius: 50px; white-space: nowrap; pointer-events: none; }
.card .info { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; min-height: 0; }
.name-btn { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.card .name { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.price { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.price .now { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
.price.is-promo .now { color: var(--red); }
.price s { color: var(--muted); font-size: .85rem; }
.actions { display: flex; gap: 6px; flex-shrink: 0; }
.buy { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.buy svg { width: 20px !important; height: 20px !important; }
.buy svg, .icon-btn svg { width: 16px; height: 16px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--ink); }
.swatches { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 28px; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--soft); padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.swatches .cname { font-size: .8rem; color: var(--muted); }
.card.under { transform: scale(.95) translateY(10px); opacity: .7; }
.card.top { cursor: grab; z-index: 2; }
.card.fly { transition: transform .32s cubic-bezier(.4, 0, .6, 1), opacity .32s; }
.card.back { transition: transform .25s cubic-bezier(.2, .9, .3, 1.3); }
.stamp { position: absolute; top: 60px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 6px; z-index: 3; font-family: var(--font-display); font-weight: 800;
  font-size: 1.6rem; text-transform: uppercase; opacity: 0; background: rgba(255,255,255,.82); pointer-events: none; }
.stamp.yes { left: 18px; color: var(--ink); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--red); transform: rotate(12deg); }

.controls { display: flex; justify-content: center; align-items: center; gap: 22px; padding-bottom: 4px; }
.verdict { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; padding: 0; transition: transform .12s; box-shadow: 0 8px 20px -12px rgba(4,0,55,.5); }
.verdict svg { width: 26px; height: 26px; }
.verdict span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.verdict.no { background: var(--surface); color: var(--ink); }
.verdict.yes { background: var(--ink); color: #fff; }
.verdict.yes svg { color: var(--red); }
.verdict:active, .verdict.flash { transform: scale(.96); }
.undo { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); }
.undo svg { width: 20px; height: 20px; } .undo:disabled { opacity: .35; cursor: default; }
.keys { text-align: center; font-size: .74rem; color: var(--muted); margin: -4px 0 0; }
@media (max-height: 700px) { .keys { display: none; } }

.state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
.state h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.state p { margin: 0; color: var(--muted); max-width: 36ch; line-height: 1.45; }
.state .row { flex-wrap: wrap; justify-content: center; }
.pill { border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 50px; padding: 10px 18px; font-family: var(--font-display); font-weight: 700; font-size: .95rem; }
.pill.dark { background: var(--ink); color: #fff; }

/* ---------- Collection ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 6px; overflow: hidden; padding: 0; border: 1px solid var(--line); background: var(--surface); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.thumb .tag { position: absolute; left: 6px; bottom: 6px; font-size: .72rem; font-weight: 700; background: var(--surface); color: var(--ink); padding: 2px 7px; border-radius: 50px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }
.coll { position: fixed; inset: 0; z-index: 18; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.coll-inner { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; flex: 1; }
.coll-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.coll-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; margin: 0; }
.coll-head .n { font-family: var(--font-body); font-weight: 400; font-size: .85rem; color: var(--muted); }
.coll-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 50px; padding: 4px; align-self: flex-start; }
.tab { border: 0; background: transparent; border-radius: 50px; padding: 8px 16px; font-family: var(--font-display); font-weight: 700; font-size: .92rem; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.profile-name { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.profile-desc { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.45; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: .82rem; }
.bar { height: 8px; border-radius: 50px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 50px; }
.bars .pct { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.palette { display: flex; flex-wrap: wrap; gap: 10px; }
.palette span { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.palette b { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: block; }
.sec-title { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 6px 0 0; }
.sec-sub { margin: -6px 0 0; font-size: .82rem; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.uni { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.uni-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 6px; flex-wrap: wrap; }
.uni-head strong { font-family: var(--font-display); font-size: 1rem; }
.uni-head span { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.look { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.look-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.look-head strong { font-family: var(--font-display); font-size: 1.05rem; }
.look-head span { font-size: .78rem; color: var(--muted); }
.look-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.look-items { margin: 0; font-size: .8rem; color: var(--muted); line-height: 1.4; }

/* ---------- Fiche article ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: end center; background: rgba(4, 0, 55, .5);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .sheet { place-items: center; } }
.sheet-panel { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.sheet-img { width: min(100%, calc(42vh * .75)); aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 6px; align-self: center; background: var(--line); }
.sheet-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0; line-height: 1.25; }
.sheet-btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center; border-radius: 50px; padding: 12px 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 1rem; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); }
.sheet-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.sheet-btn.primary { background: var(--ink); color: #fff; }
.sheet-row { display: flex; gap: 8px; flex-wrap: wrap; } .sheet-row > * { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(108px + env(safe-area-inset-top, 0px)); z-index: 25; animation: toastIn .25s ease-out; display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: #fff; border-radius: 50px; padding: 6px 6px 6px 8px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--surface); }
.toast span { font-size: .88rem; white-space: nowrap; padding-right: 4px; }
.toast a, .toast button { background: var(--red); color: #fff; border: 0; border-radius: 50px; padding: 8px 14px; font-family: var(--font-display); font-weight: 700; font-size: .9rem; white-space: nowrap; text-decoration: none; }

/* ---------- Animation d'ouverture : les lettres sautent en arc, le mot craque, le K arrive ---------- */
.splash { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.splash-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.word { display: flex; font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 15vw, 5rem); letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.word .l { display: inline-block; transform-origin: 50% 100%; opacity: 0; }
.splash .by { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; color: var(--muted); align-self: flex-end; margin-right: 4px; }
.splash .by span { opacity: 0; }
.splash .by img { height: 46px; width: auto; opacity: 0; transform-origin: 50% 100%; }
.trails { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.trails path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.splash .skip { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: .78rem; color: var(--soft); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .photo.loading::after { animation: none; } .card.fly, .card.back { transition: none; } }
@media (max-width: 380px) { .brand b { font-size: 1.3rem; } .verdict { font-size: .95rem; } }
</style>
</head>
<body>

<div class="splash" id="splash" role="img" aria-label="Craquage by Kiabi">
  <div class="splash-inner" id="splash-inner">
    <div class="word" id="word" aria-hidden="true"></div>
    <div class="by"><span>by</span><img id="splash-k" src="assets/kiabi-k.svg" alt=""></div>
  </div>
  <div class="skip">Touchez pour passer</div>
</div>

<div class="app">
  <header>
    <a class="brand" href="./" aria-label="Craquage by Kiabi"><b>Craquage</b><span>by</span><img src="assets/kiabi-k.svg" alt="Kiabi"></a>
    <button class="coll-btn" id="coll-btn" type="button" aria-label="Voir ma collection">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
      <span class="badge" id="coll-count">0</span>
    </button>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Catégories"></div>

  <section class="state" id="loading">
    <h2>Chargement des articles…</h2>
    <p>On prépare les dernières nouveautés Kiabi.</p>
  </section>
  <section class="state" id="error" hidden>
    <h2>Impossible de charger les articles</h2>
    <p>Vérifie ta connexion internet, puis réessaie.</p>
    <button class="pill dark" type="button" onclick="location.reload()">Réessayer</button>
  </section>

  <section id="swipe-view" style="display:none">
    <div class="stage"><div class="deck" id="deck"></div></div>
    <div class="controls">
      <button class="verdict no" id="btn-no" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>No go</span>
      </button>
      <button class="undo" id="btn-undo" type="button" aria-label="Annuler le dernier choix" title="Annuler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="verdict yes" id="btn-yes" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg><span>Go</span>
      </button>
    </div>
  </section>

  <section class="state" id="end" hidden>
    <h2 id="end-title">Tu as tout vu !</h2>
    <p id="end-text"></p>
    <div class="row">
      <button class="pill dark" id="end-coll" type="button">Voir mes envies</button>
      <button class="pill" id="end-restart" type="button">Revoir mes « No go »</button>
      <button class="pill" id="end-all" type="button" hidden>Toutes les catégories</button>
    </div>
  </section>
</div>

<div class="coll" id="coll" hidden role="dialog" aria-modal="true" aria-labelledby="coll-title">
  <div class="coll-inner">
    <div class="coll-head">
      <h2 id="coll-title">Mes envies <span class="n" id="coll-n"></span></h2>
      <button class="pill" type="button" id="coll-close">Fermer</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-items" aria-selected="true" type="button">Articles</button>
      <button class="tab" role="tab" id="tab-styles" aria-selected="false" type="button">Mes styles</button>
      <button class="tab" role="tab" id="tab-looks" aria-selected="false" type="button">Mes looks</button>
    </div>
    <div class="coll-body" id="pane-items"><p class="empty" id="coll-hint"></p><div class="grid" id="coll-grid"></div></div>
    <div class="coll-body" id="pane-styles" hidden></div>
    <div class="coll-body" id="pane-looks" hidden></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"><img id="toast-img" alt=""><span id="toast-text">Ajouté à tes envies</span><a id="toast-buy" href="#" target="_blank" rel="noopener">Acheter</a></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <img class="sheet-img" id="sheet-img" alt="">
    <p class="sheet-title" id="sheet-title"></p>
    <div class="row" style="flex-wrap:wrap"><div class="price" id="sheet-price"></div><div class="swatches" id="sheet-sw"></div></div>
    <a class="sheet-btn primary" id="sheet-buy" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 01-1.5 1.3H7.7a1.5 1.5 0 01-1.5-1.3L5 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg>
      Acheter sur kiabi.com
    </a>
    <button class="sheet-btn" id="sheet-share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
      Envoyer à une amie
    </button>
    <div class="sheet-row">
      <button class="pill" type="button" id="sheet-move">Retirer de mes envies</button>
      <button class="pill" type="button" id="sheet-close">Fermer</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const eur = n => n.toFixed(2).replace('.', ',') + ' €';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = 'https://static.kiabi.com/images/';
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

  // ---------- Animation d'ouverture ----------
  function playSplash() {
    const sp = $('splash'), inner = $('splash-inner'), word = $('word'), byTxt = sp.querySelector('.by span'), K = $('splash-k');
    let done = false;
    const finish = () => { if (done) return; done = true; sp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, fill: 'forwards' }).onfinish = () => sp.remove(); };
    sp.addEventListener('click', finish);
    const letters = [...'Craquage'].map(ch => { const s = document.createElement('span'); s.className = 'l'; s.textContent = ch; word.appendChild(s); return s; });
    if (reduced || !sp.animate) { letters.forEach(l => l.style.opacity = 1); byTxt.style.opacity = 1; K.style.opacity = 1; return setTimeout(finish, 1100); }
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('class', 'trails'); inner.appendChild(svg);
    const box = el => { const r = el.getBoundingClientRect(), o = inner.getBoundingClientRect(); return { x: r.left - o.left + r.width / 2, y: r.top - o.top + r.height / 2, h: r.height }; };
    // trait de vitesse : se dessine derrière l'élément puis s'efface
    function trail(d, delay, dur) {
      const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.appendChild(p);
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0, offset: .55 }, { strokeDashoffset: -len }], { duration: dur, delay, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' });
    }
    // saut en arc : départ décalé, sommet, atterrissage écrasé, rebond
    function jump(el, from, delay, dur) {
      el.animate([
        { opacity: 0, transform: `translate(${from[0]}px, ${from[1]}px) rotate(${from[2]}deg)` },
        { opacity: 1, transform: `translate(${from[0] * .45}px, ${-Math.abs(from[1]) * .55 - 40}px) rotate(${from[2] * .4}deg)`, offset: .45 },
        { opacity: 1, transform: 'translate(0, 0) rotate(0) scale(1.15, .82)', offset: .78 },
        { opacity: 1, transform: 'translate(0, -6px) rotate(0) scale(.96, 1.05)', offset: .9 },
        { opacity: 1, transform: 'translate(0, 0) rotate(0) scale(1)' }
      ], { duration: dur, delay, easing: 'cubic-bezier(.33,.66,.55,1)', fill: 'both' });
    }
    letters.forEach((l, i) => jump(l, [-30 - (7 - i) * 6, 70 + (i % 3) * 25, -25 + i * 4], 120 + i * 70, 620));
    const c = box(letters[0]);
    trail(`M ${c.x - 70} ${c.y + 120} Q ${c.x - 60} ${c.y - 150} ${c.x + 10} ${c.y - 110}`, 60, 640);
    // le mot craque : chaque lettre se penche un peu, petite secousse
    const crackAt = 120 + 7 * 70 + 620 + 40;
    const tilt = [-7, 5, -4, 8, -6, 4, -8, 6], lift = [2, -3, 1, -4, 3, -2, 1, -3];
    letters.forEach((l, i) => l.animate([{ transform: 'rotate(0) translateY(0)' }, { transform: `rotate(${tilt[i] * 1.6}deg) translateY(${lift[i] * 1.8}px)`, offset: .35 },
      { transform: `rotate(${tilt[i]}deg) translateY(${lift[i]}px)` }], { duration: 380, delay: crackAt, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards', composite: 'add' }));
    word.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(-2px)' }, { transform: 'translateX(0)' }], { duration: 260, delay: crackAt });
    // « by » puis le K arrive de loin en grand arc
    byTxt.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: crackAt + 200, fill: 'both' });
    const k = box(K);
    trail(`M ${k.x + 190} ${k.y + 70} Q ${k.x + 70} ${k.y - 46} ${k.x + 8} ${k.y - 2}`, crackAt + 180, 700);
    K.animate([
      { opacity: 0, transform: 'translate(180px, 60px) rotate(40deg)' },
      { opacity: 1, transform: 'translate(64px, -26px) rotate(14deg)', offset: .5 },
      { opacity: 1, transform: 'translate(0, 0) rotate(0) scale(1.18, .8)', offset: .8 },
      { opacity: 1, transform: 'translate(0, -5px) scale(.95, 1.06)', offset: .9 },
      { opacity: 1, transform: 'translate(0, 0) scale(1)' }
    ], { duration: 620, delay: crackAt + 240, easing: 'cubic-bezier(.33,.66,.55,1)', fill: 'both' });
    setTimeout(finish, crackAt + 240 + 620 + 650);
  }
  playSplash();

  // ---------- Données ----------
  let PRODUCTS = [], byId = new Map();
  const SW = { 'écru': '#efe8d8', 'blanc': '#f7f7f4', 'noir': '#1b1b1b', 'marine': '#1f2a4a', 'bleu clair': '#b9cbe8', 'denim': '#3d5a8a', 'bleu': '#4f74b3', 'gris': '#8a8d92',
    'beige': '#d8c3a5', 'camel': '#b48a5f', 'marron': '#5a3a2a', 'taupe': '#9b8b7a', 'kaki': '#7a7a32', 'vert': '#5f7a4f', 'bordeaux': '#6e1f2b', 'rouge': '#c0392b',
    'rose': '#e7a3b5', 'jaune': '#ecd36a', 'orange': '#e07b39', 'violet': '#8a6bb0',
    'léopard': 'linear-gradient(135deg,#c9a777 30%,#3b2a1c 30% 40%,#c9a777 40% 70%,#3b2a1c 70% 80%,#c9a777 80%)', 'multicolore': 'conic-gradient(#ed2237,#ecd36a,#5f7a4f,#4f74b3,#ed2237)' };
  const CATS = [['all', 'Tout'], ['deal', 'Bons plans'], ['robe', 'Robes'], ['pull', 'Pulls & gilets'], ['haut', 'Hauts & chemises'], ['pantalon', 'Pantalons & jeans'],
    ['jupe', 'Jupes'], ['veste', 'Manteaux & vestes'], ['chaussures', 'Chaussures'], ['accessoire', 'Accessoires']];
  const LOOK = { haut: 'haut', pull: 'haut', robe: 'robe', pantalon: 'bas', jupe: 'bas', veste: 'veste', chaussures: 'extra', accessoire: 'extra' };
  const photo = (c, size, k = 0) => IMG + c.i + '_' + size + (c.x[k] || c.x[0] || 1) + '.jpg';
  const discount = c => { const now = Math.min(...c.p), was = Math.max(...c.p); return was > now ? Math.round((1 - now / was) * 100) : 0; };

  // ---------- État ----------
  const KEY = 'craquage-kiabi-v1';
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let order = [], history = [], verdicts = {}, chosen = {}, cat = 'all', busy = false;
  const broken = new Set(), photoIdx = {};
  const colorIdx = id => Math.min(chosen[id] || 0, byId.get(id).c.length - 1);
  const curColor = id => byId.get(id).c[colorIdx(id)];
  const matches = id => {
    const p = byId.get(id); if (broken.has(id)) return false;
    if (cat === 'all') return true;
    if (cat === 'deal') return p.c.some(c => discount(c) >= 30);
    return p.k === cat;
  };
  const upcoming = n => { const out = []; for (const id of order) { if (!verdicts[id] && matches(id)) { out.push(id); if (out.length >= n) break; } } return out; };
  const currentId = () => upcoming(1)[0];
  const goIds = () => order.filter(id => verdicts[id] === 'yes' && !broken.has(id));
  let saveTimer = null;
  const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set(KEY, { order, history, verdicts, chosen, cat }), 400); };

  // ---------- Photos (avec repli si une image Kiabi manque) ----------
  function setPhoto(img, id, size, onFail) {
    const c = curColor(id), key = id + ':' + colorIdx(id) + ':' + size;
    let k = photoIdx[key] || 0;
    img.onerror = () => {
      k++; photoIdx[key] = k;
      if (k < c.x.length) img.src = photo(c, size, k);
      else if (size === 'hd') { img.onerror = () => onFail && onFail(); img.src = photo(c, 'fr', 0); }
      else onFail && onFail();
    };
    img.src = photo(c, size, k);
  }
  const preload = id => { const im = new Image(); im.src = photo(curColor(id), 'hd', photoIdx[id + ':' + colorIdx(id) + ':hd'] || 0); };
  function markBroken(id) { if (broken.has(id)) return; broken.add(id); if (!verdicts[id]) render(); }

  // ---------- Couleurs ----------
  function swatchButtons(id, onPick) {
    const p = byId.get(id), frag = document.createDocumentFragment();
    p.c.forEach((c, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.style.background = SW[c.f] || '#b3b2c2';
      b.setAttribute('aria-label', 'Couleur ' + c.c); b.title = c.c; b.setAttribute('aria-pressed', String(k === colorIdx(id)));
      b.addEventListener('pointerdown', e => e.stopPropagation());
      b.addEventListener('click', e => { e.stopPropagation(); chosen[id] = k; onPick(); save(); });
      frag.appendChild(b);
    });
    return frag;
  }
  const priceHtml = c => { const now = Math.min(...c.p), was = Math.max(...c.p); return `<span class="now">${eur(now)}</span>` + (was > now ? `<s>${eur(was)}</s>` : ''); };

  // ---------- Partage ----------
  async function share(id) {
    const p = byId.get(id), c = curColor(id), text = `Regarde ce que j’ai trouvé sur Kiabi : ${p.n} à ${eur(Math.min(...c.p))}`;
    try {
      if (navigator.share) { await navigator.share({ title: p.n, text, url: c.u }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + c.u); flash('Lien copié, colle-le dans un message'); }
    catch (e) { flash('Copie impossible : ' + c.u); }
  }
  function flash(msg) {
    const t = $('toast'); $('toast-img').hidden = true; $('toast-buy').hidden = true; $('toast-text').textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 2600);
  }

  // ---------- Carte ----------
  let hintShown = !!store.get('craquage-hint');
  function fillCard(el, id) {
    const p = byId.get(id), c = curColor(id), k = colorIdx(id), d = discount(c);
    const ph = el.querySelector('.photo'), img = ph.querySelector('img');
    ph.classList.add('loading'); img.onload = () => ph.classList.remove('loading');
    setPhoto(img, id, 'hd', () => markBroken(id)); img.alt = p.n + ', ' + c.c;
    el.querySelector('.segs').innerHTML = p.c.length > 1 ? p.c.map((_, j) => `<i class="${j === k ? 'on' : ''}"></i>`).join('') : '';
    const promo = el.querySelector('.promo'); promo.hidden = !d; promo.textContent = d ? '−' + d + ' %' : '';
    el.querySelector('.tap-hint').hidden = !(p.c.length > 1 && !hintShown && el.classList.contains('top'));
    el.querySelector('.name').textContent = p.n;
    const pr = el.querySelector('.price'); pr.className = 'price' + (d ? ' is-promo' : ''); pr.innerHTML = priceHtml(c);
    el.querySelector('.buy').href = c.u;
    const sw = el.querySelector('.swatches'); sw.innerHTML = ''; sw.appendChild(swatchButtons(id, () => fillCard(el, id)));
    if (p.c.length < 2) sw.hidden = true;
    if (el.classList.contains('top')) p.c.forEach((_, j) => { if (j !== k) { const im = new Image(); im.src = photo(p.c[j], 'hd', 0); } });
  }
  function makeCard(id, cls) {
    const el = document.createElement('article'); el.className = 'card ' + cls;
    el.innerHTML = `<div class="photo"><img alt="" draggable="false"><div class="segs"></div><span class="promo" hidden></span>
      <span class="tap-hint" hidden>Touche la photo pour changer de couleur</span><div class="stamp yes">Go</div><div class="stamp no">No go</div></div>
      <div class="info"><div class="row"><button class="name-btn" type="button"><span class="name"></span><span class="price"></span></button>
      <a class="buy" target="_blank" rel="noopener" aria-label="Acheter sur kiabi.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 01-1.5 1.3H7.7a1.5 1.5 0 01-1.5-1.3L5 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg></a>
      </div><div class="swatches" role="group" aria-label="Couleurs"></div></div>`;
    el.querySelectorAll('.buy, .name-btn').forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));
    el.querySelector('.name-btn').addEventListener('click', e => { e.stopPropagation(); openSheet(id, true); });
    fillCard(el, id);
    return el;
  }

  function render() {
    save();
    const deckEl = $('deck'); deckEl.querySelectorAll('.card').forEach(n => n.remove());
    const next = upcoming(4), done = next.length === 0;
    $('swipe-view').style.display = done ? 'none' : 'contents';
    $('end').hidden = !done;
    $('btn-undo').disabled = history.length === 0;
    const nGo = goIds().length; $('coll-count').textContent = nGo; $('coll-count').hidden = !nGo;
    renderChips();
    if (done) {
      const label = (CATS.find(c => c[0] === cat) || CATS[0])[1], n = goIds().length;
      $('end-title').textContent = cat === 'all' ? 'Tu as tout vu !' : `Tu as tout vu dans « ${label} »`;
      $('end-text').textContent = `${n} article${n > 1 ? 's' : ''} dans tes envies. De nouveaux articles arrivent chaque jour.`;
      $('end-all').hidden = cat === 'all';
      $('end-restart').hidden = !Object.values(verdicts).includes('no');
      return;
    }
    if (next[1]) deckEl.appendChild(makeCard(next[1], 'under'));
    const top = makeCard(next[0], 'top'); deckEl.appendChild(top); attachDrag(top);
    next.slice(2).forEach(preload);
  }
  function renderChips() {
    const box = $('chips'); box.innerHTML = '';
    CATS.forEach(([k, label]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (k === 'deal' ? ' deal' : '');
      b.textContent = label; b.setAttribute('aria-pressed', String(cat === k));
      b.onclick = () => { cat = k; hideToast(); render(); };
      box.appendChild(b);
    });
    const on = box.querySelector('.chip[aria-pressed="true"]');
    if (on) box.scrollLeft = Math.max(0, on.offsetLeft - box.clientWidth / 2 + on.offsetWidth / 2);
  }

  function decide(choice) {
    const id = currentId(); if (busy || !id) return;
    const top = $('deck').querySelector('.card.top');
    const btn = $(choice === 'yes' ? 'btn-yes' : 'btn-no'); btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 160);
    const commit = () => { verdicts[id] = choice; history.push({ id, choice }); busy = false; render(); if (choice === 'yes') showToast(id); else hideToast(); };
    if (!top || reduced) return commit();
    busy = true;
    const dir = choice === 'yes' ? 1 : -1;
    top.querySelector('.stamp.' + choice).style.opacity = 1;
    top.classList.add('fly'); top.style.transform = `translate(${dir * 140}%, -4%) rotate(${dir * 24}deg)`; top.style.opacity = 0;
    setTimeout(commit, 300);
  }
  function undo() {
    if (busy || !history.length) return;
    const last = history.pop(); delete verdicts[last.id];
    order = [last.id].concat(order.filter(x => x !== last.id));
    if (!matches(last.id)) cat = 'all';
    hideToast(); render();
  }
  function attachDrag(card) {
    let x0 = 0, y0 = 0, dx = 0, dy = 0, active = false, onPhoto = false;
    const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
    card.addEventListener('pointerdown', e => {
      if (busy) return; active = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; onPhoto = !!e.target.closest('.photo');
      card.setPointerCapture(e.pointerId); card.classList.remove('back');
    });
    card.addEventListener('pointermove', e => {
      if (!active) return; dx = e.clientX - x0; dy = e.clientY - y0;
      card.style.transform = `translate(${dx}px, ${dy * .35}px) rotate(${dx / 18}deg)`;
      const t = Math.min(Math.abs(dx) / 110, 1); yes.style.opacity = dx > 0 ? t : 0; no.style.opacity = dx < 0 ? t : 0;
    });
    const end = () => {
      if (!active) return; active = false;
      if (Math.abs(dx) > Math.min(110, card.offsetWidth * .28)) return decide(dx > 0 ? 'yes' : 'no');
      card.classList.add('back'); card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6 && onPhoto) {          // toucher la photo = couleur suivante
        const id = currentId(), n = byId.get(id).c.length;
        if (n > 1) { chosen[id] = (colorIdx(id) + 1) % n; fillCard(card, id); save(); if (!hintShown) { hintShown = true; store.set('craquage-hint', 1); card.querySelector('.tap-hint').hidden = true; } }
      }
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }
  $('btn-yes').onclick = () => decide('yes');
  $('btn-no').onclick = () => decide('no');
  $('btn-undo').onclick = undo;
  document.addEventListener('keydown', e => {
    if (!$('sheet').hidden || !$('coll').hidden) { if (e.key === 'Escape') { if (!$('sheet').hidden) closeSheet(); else $('coll').hidden = true; } return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); decide('yes'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); decide('no'); }
    else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
  });
  $('end-restart').onclick = () => { Object.keys(verdicts).forEach(id => { if (verdicts[id] === 'no') delete verdicts[id]; }); history = history.filter(h => h.choice === 'yes'); render(); };
  $('end-all').onclick = () => { cat = 'all'; render(); };
  $('end-coll').onclick = () => openColl();

  // ---------- Mes envies ----------
  function thumbBtn(id, label) {
    const c = curColor(id), b = document.createElement('button'); b.className = 'thumb'; b.type = 'button';
    b.setAttribute('aria-label', byId.get(id).n + ', ' + c.c);
    b.innerHTML = `<img alt="" loading="lazy"><span class="tag">${esc(label || eur(Math.min(...c.p)))}</span>`;
    setPhoto(b.querySelector('img'), id, 'fr'); b.onclick = () => openSheet(id);
    return b;
  }
  function renderColl() {
    const ids = goIds().slice().reverse(), grid = $('coll-grid');
    $('coll-n').textContent = ids.length ? `${ids.length} article${ids.length > 1 ? 's' : ''}` : '';
    $('coll-hint').textContent = ids.length ? 'Touche un article pour l’acheter, l’envoyer à une amie ou changer sa couleur.' : 'Rien pour l’instant. Glisse à droite (Go) les articles qui te plaisent. Tout est enregistré sur ce téléphone.';
    grid.innerHTML = ''; ids.forEach(id => grid.appendChild(thumbBtn(id)));
  }
  function openColl() { hideToast(); renderColl(); showTab('items'); $('coll').hidden = false; $('coll-close').focus(); }
  $('coll-btn').onclick = openColl;
  $('coll-close').onclick = () => { $('coll').hidden = true; };

  // ---------- Mes styles ----------
  const STYLE = { cosy: ['Cocooning', 'mailles douces et pièces chaudes'], chic: ['Chic', 'coupes nettes et pièces habillées'], casual: ['Casual', 'des pièces faciles à porter tous les jours'],
    retro: ['Rétro', 'velours, volants et imprimés vintage'], preppy: ['Preppy', 'rayures, carreaux et esprit college'], minimal: ['Minimaliste', 'des lignes simples et des couleurs sobres'],
    rock: ['Rock', 'effet cuir, vinyle et léopard'], glam: ['Glam', 'des matières qui brillent'], sport: ['Sporty', 'sweats, doudounes et confort'] };
  const NEUTRAL = new Set(['noir', 'blanc', 'écru', 'beige', 'gris', 'marine', 'denim', 'camel', 'taupe', 'marron', 'léopard']);
  const CATLABEL = { haut: 'haut', bas: 'bas', veste: 'veste', robe: 'robe', extra: 'touche finale' };
  const meta = id => { const p = byId.get(id); return { cat: LOOK[p.k], tags: p.t.length ? p.t : ['casual'], col: curColor(id).f }; };
  function pairScore(a, b) {
    const A = meta(a), B = meta(b), shared = A.tags.filter(t => B.tags.includes(t)).length;
    return shared * 2 + ((NEUTRAL.has(A.col) || NEUTRAL.has(B.col) || A.col === B.col) ? 1 : -1) + (A.tags[0] === B.tags[0] ? 1 : 0);
  }
  function buildLooks(ids) {
    const by = c => ids.filter(i => meta(i).cat === c), usage = new Map();
    const best = (pool, look) => { let top = null, sc = -Infinity;
      for (const p of pool) { if (look.includes(p) || (usage.get(p) || 0) >= 2) continue;
        const v = look.reduce((s, l) => s + pairScore(l, p), 0) / look.length - (usage.get(p) || 0) * 1.5; if (v > sc) { sc = v; top = p; } }
      return sc > 0 ? top : null; };
    const looks = [];
    for (const a of [...by('robe'), ...by('haut')]) {
      const look = [a];
      if (meta(a).cat === 'haut') { const b = best(by('bas'), look); if (b) look.push(b); }
      const v = best(by('veste'), look); if (v) look.push(v);
      const x = best(by('extra'), look); if (x) look.push(x);
      if (look.length < 2) continue;
      looks.push({ look, score: look.slice(1).reduce((s, x) => s + pairScore(a, x), 0) / (look.length - 1) + look.length * .5 });
      look.forEach(x => usage.set(x, (usage.get(x) || 0) + 1));
    }
    return looks.sort((x, y) => y.score - x.score).slice(0, 6).map(({ look }) => {
      const count = {}; look.forEach(x => meta(x).tags.forEach((t, k) => count[t] = (count[t] || 0) + (k ? 1 : 2)));
      return { look, tag: Object.keys(count).sort((p, q) => count[q] - count[p])[0] };
    });
  }
  function renderStyles() {
    const pane = $('pane-styles'); pane.innerHTML = '';
    const ids = goIds();
    if (ids.length < 2) { pane.innerHTML = '<p class="empty">Mets au moins 2 articles en Go pour voir apparaître tes styles.</p>'; return; }
    const w = {}; let total = 0;
    ids.forEach(id => meta(id).tags.forEach((t, k) => { const v = k ? 1 : 2; w[t] = (w[t] || 0) + v; total += v; }));
    const ranked = Object.keys(w).sort((a, b) => w[b] - w[a]), [t1, t2] = ranked, share1 = w[t1] / total;
    const name = (!t2 || share1 > .55) ? STYLE[t1][0] : `${STYLE[t1][0]} × ${STYLE[t2][0]}`;
    const desc = t2 && share1 <= .55 ? `Tu craques surtout pour ${STYLE[t1][1]}, avec une touche ${STYLE[t2][0].toLowerCase()} : ${STYLE[t2][1]}.` : `Tu craques surtout pour ${STYLE[t1][1]}.`;
    const cols = {}; ids.forEach(id => { const f = meta(id).col; cols[f] = (cols[f] || 0) + 1; });
    const palette = Object.keys(cols).sort((a, b) => cols[b] - cols[a]).slice(0, 6);
    const prof = document.createElement('section'); prof.className = 'profile';
    prof.innerHTML = `<p class="eyebrow">Ton style, d’après ${ids.length} coups de cœur</p><p class="profile-name">${esc(name)}</p><p class="profile-desc">${esc(desc)}</p>
      <div class="bars">${ranked.slice(0, 4).map(t => { const pct = Math.round(w[t] / total * 100); return `<span>${STYLE[t][0]}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="pct">${pct} %</span>`; }).join('')}</div>
      <div><p class="eyebrow" style="margin-bottom:8px">Ta palette</p><div class="palette">${palette.map(c => `<span><b style="background:${SW[c] || '#999'}"></b>${esc(c)}</span>`).join('')}</div></div>`;
    pane.appendChild(prof);
    const unis = ranked.filter(t => ids.filter(id => meta(id).tags.includes(t)).length >= 2);
    if (unis.length) {
      const h = document.createElement('h3'); h.className = 'sec-title'; h.textContent = 'Tes univers'; pane.appendChild(h);
      const grid = document.createElement('div'); grid.className = 'cards';
      unis.forEach(t => {
        const its = ids.filter(id => meta(id).tags.includes(t)).sort((a, b) => (meta(b).tags[0] === t) - (meta(a).tags[0] === t));
        const card = document.createElement('div'); card.className = 'uni';
        card.innerHTML = `<div class="uni-head"><strong>${STYLE[t][0]}</strong><span>${its.length} articles</span></div>`;
        const m = document.createElement('div'); m.className = 'mosaic'; its.slice(0, 4).forEach(id => m.appendChild(thumbBtn(id)));
        card.appendChild(m); grid.appendChild(card);
      });
      pane.appendChild(grid);
    }
    const looks = buildLooks(ids);
    const h = document.createElement('h3'); h.className = 'sec-title'; h.textContent = 'Looks proposés'; pane.appendChild(h);
    const sub = document.createElement('p'); sub.className = 'sec-sub';
    sub.textContent = looks.length ? 'Assemblés avec tes envies. Touche une pièce pour l’acheter.' : 'Mets un haut, un bas ou une veste en Go pour obtenir des looks.'; pane.appendChild(sub);
    looks.forEach((L, k) => {
      const el = document.createElement('div'); el.className = 'look';
      const total = L.look.reduce((s, id) => s + Math.min(...curColor(id).p), 0);
      el.innerHTML = `<div class="look-head"><strong>Look ${k + 1} · ${STYLE[L.tag][0]}</strong><span>${L.look.length} pièces · ${eur(total)}</span></div>`;
      const row = document.createElement('div'); row.className = 'look-row'; L.look.forEach(id => row.appendChild(thumbBtn(id, CATLABEL[meta(id).cat])));
      el.appendChild(row);
      const p = document.createElement('p'); p.className = 'look-items'; p.textContent = L.look.map(id => byId.get(id).n).join(' + '); el.appendChild(p);
      const sv = document.createElement('button'); sv.className = 'pill dark'; sv.type = 'button'; sv.style.alignSelf = 'flex-start';
      const already = savedLooks.some(l => lookKey(l.items) === lookKey(L.look.map(id => ({ id }))));
      sv.textContent = already ? 'Enregistré' : 'Enregistrer ce look'; sv.disabled = already; sv.onclick = () => saveLook(L.look, sv);
      el.appendChild(sv);
      pane.appendChild(el);
    });
  }
  function showTab(which) {
    ['items', 'styles', 'looks'].forEach(t => { $('tab-' + t).setAttribute('aria-selected', String(t === which)); $('pane-' + t).hidden = t !== which; });
    if (which === 'styles') renderStyles();
    if (which === 'looks') renderSavedLooks();
  }
  $('tab-items').onclick = () => showTab('items');
  $('tab-styles').onclick = () => showTab('styles');
  $('tab-looks').onclick = () => showTab('looks');

  // ---------- Mes looks (enregistrés sur cet appareil) ----------
  const LOOKS_KEY = 'craquage-looks-v1';
  let savedLooks = (store.get(LOOKS_KEY) || []).filter(l => Array.isArray(l.items));
  const lookKey = items => items.map(x => x.id).sort().join('|');
  function saveLook(ids, btn) {
    const items = ids.map(id => ({ id, k: colorIdx(id) })), key = lookKey(items);
    if (!savedLooks.some(l => lookKey(l.items) === key)) { savedLooks.unshift({ items, at: Date.now() }); store.set(LOOKS_KEY, savedLooks); }
    if (btn) { btn.textContent = 'Enregistré'; btn.disabled = true; }
    flash('Look enregistré dans « Mes looks »');
  }
  function renderSavedLooks() {
    const pane = $('pane-looks'); pane.innerHTML = '';
    const list = savedLooks.map(l => ({ ...l, items: l.items.filter(x => byId.has(x.id)) })).filter(l => l.items.length >= 2);
    if (!list.length) { pane.innerHTML = '<p class="empty">Aucun look enregistré. Dans « Mes styles », touche « Enregistrer » sous un look qui te plaît. Tes looks restent sur ce téléphone.</p>'; return; }
    list.forEach((L, n) => {
      L.items.forEach(x => { if (chosen[x.id] == null) chosen[x.id] = x.k; });
      const el = document.createElement('div'); el.className = 'look';
      const total = L.items.reduce((s, x) => s + Math.min(...byId.get(x.id).c[Math.min(x.k, byId.get(x.id).c.length - 1)].p), 0);
      el.innerHTML = `<div class="look-head"><strong>Look ${list.length - n}</strong><span>${L.items.length} pièces · ${eur(total)}</span></div>`;
      const row = document.createElement('div'); row.className = 'look-row'; L.items.forEach(x => row.appendChild(thumbBtn(x.id))); el.appendChild(row);
      const del = document.createElement('button'); del.className = 'pill'; del.type = 'button'; del.textContent = 'Supprimer ce look'; del.style.alignSelf = 'flex-start';
      del.onclick = () => { savedLooks = savedLooks.filter(l => lookKey(l.items) !== lookKey(L.items)); store.set(LOOKS_KEY, savedLooks); renderSavedLooks(); };
      el.appendChild(del); pane.appendChild(el);
    });
  }

  // ---------- Fiche article ----------
  let sheetId = null, toastTimer = null;
  function fillSheet() {
    const id = sheetId, p = byId.get(id), c = curColor(id);
    setPhoto($('sheet-img'), id, 'hd'); $('sheet-img').alt = p.n + ', ' + c.c;
    $('sheet-title').textContent = p.n;
    $('sheet-price').innerHTML = priceHtml(c); $('sheet-price').className = 'price' + (discount(c) ? ' is-promo' : '');
    $('sheet-buy').href = c.u;
    $('sheet-move').hidden = verdicts[id] !== 'yes';
    const sw = $('sheet-sw'); sw.innerHTML = ''; sw.appendChild(swatchButtons(id, () => { fillSheet(); if (!$('coll').hidden) { renderColl(); if (!$('pane-styles').hidden) renderStyles(); } }));
  }
  function openSheet(id) { hideToast(); sheetId = id; fillSheet(); $('sheet').hidden = false; $('sheet-buy').focus(); }
  function closeSheet() { $('sheet').hidden = true; sheetId = null; }
  $('sheet-close').onclick = closeSheet;
  $('sheet-share').onclick = () => sheetId && share(sheetId);
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('sheet-move').onclick = () => {
    if (!sheetId) return; verdicts[sheetId] = 'no'; closeSheet();
    if (!$('coll').hidden) { renderColl(); if (!$('pane-styles').hidden) renderStyles(); }
    render();
  };
  function showToast(id) {
    clearTimeout(toastTimer);
    const img = $('toast-img'); img.hidden = false; setPhoto(img, id, 'fr');
    $('toast-text').textContent = 'Ajouté à tes envies'; $('toast-buy').hidden = false; $('toast-buy').href = curColor(id).u;
    $('toast').hidden = false; toastTimer = setTimeout(hideToast, 3500);
  }
  function hideToast() { clearTimeout(toastTimer); $('toast').hidden = true; }

  // ---------- Démarrage ----------
  fetch('data/products.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    PRODUCTS = data.products; byId = new Map(PRODUCTS.map(p => [p.id, p]));
    const st = store.get(KEY);
    const all = shuffle(PRODUCTS.map(p => p.id));
    if (st && Array.isArray(st.order)) {
      const kept = st.order.filter(id => byId.has(id)), seen = new Set(kept);
      order = kept.concat(all.filter(id => !seen.has(id)));                 // les nouveautés rejoignent la pile
      Object.entries(st.verdicts || {}).forEach(([id, v]) => { if (byId.has(id) && (v === 'yes' || v === 'no')) verdicts[id] = v; });
      Object.entries(st.chosen || {}).forEach(([id, k]) => { if (byId.has(id) && Number.isInteger(k)) chosen[id] = k; });
      history = (st.history || []).filter(h => h && byId.has(h.id));
      if (CATS.some(c => c[0] === st.cat)) cat = st.cat;
    } else order = all;
    $('loading').hidden = true; render();
  }).catch(() => { $('loading').hidden = true; $('error').hidden = false; });

  // pas de zoom : pincement et double-tap bloqués (Safari ignore la balise viewport)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastTouch = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 320 && !e.target.closest('input, textarea')) e.preventDefault(); lastTouch = now; }, { passive: false });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>

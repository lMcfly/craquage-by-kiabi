<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Craquage by Kiabi</title>
<meta name="description" content="Swipe les articles Kiabi : Go ou No go, change de couleur, garde tes coups de cœur et achète en un clic.">
<meta name="theme-color" content="#040037">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Craquage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.kiabi.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* DA de l'app Kiabi : bleu nuit #040037, rouge #ed2237, fond gris très clair, cartes très arrondies,
   boutons « verre » flottants, barre d'onglets en pilule, titres très gras, nom d'article en graisse normale. */
:root {
  --ink: #040037; --red: #ed2237; --bg: #f3f3f8; --surface: #ffffff; --line: #e6e6ee; --muted: #6e6d85; --soft: #b3b2c2; --active: #ececf3;
  --glass: rgba(255, 255, 255, .78); --glass-line: rgba(255, 255, 255, .9);
  --shadow: 0 16px 36px -18px rgba(4, 0, 55, .32); --shadow-s: 0 6px 18px -8px rgba(4, 0, 55, .28);
  --font-display: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif; --font-body: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
  --tabbar: calc(78px + env(safe-area-inset-bottom, 0px));
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%;
}
button, a { touch-action: manipulation; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: var(--shadow-s); border: 1px solid var(--glass-line); }
.ico { width: 22px; height: 22px; flex-shrink: 0; }

.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; padding-bottom: calc(var(--tabbar) + 6px); }

/* ---------- En-tête ---------- */
header { display: flex; align-items: center; justify-content: center; min-height: 34px; }
.brand { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; line-height: 1; }
.brand span { font-weight: 500; font-size: .9rem; color: var(--muted); }
.brand img { height: 24px; width: auto; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; padding-block: 2px 6px;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; border: 0; background: var(--surface); color: var(--ink); border-radius: 50px; padding: 9px 16px; font-weight: 600; font-size: .9rem; white-space: nowrap; box-shadow: 0 2px 8px -4px rgba(4,0,55,.18); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip.deal { color: var(--red); }
.chip.deal[aria-pressed="true"] { background: var(--red); color: #fff; }

/* ---------- Cartes ---------- */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; container-type: size; }
.deck { --info: 96px; --w: min(100cqw, calc((100cqh - var(--info)) * .75), 460px); position: relative; width: var(--w); height: calc(var(--w) * 4 / 3 + var(--info)); max-width: 100%; }
.card { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow);
  touch-action: none; user-select: none; will-change: transform; display: flex; flex-direction: column; }
.card .photo { position: relative; width: 100%; aspect-ratio: 3 / 4; flex-shrink: 0; background: #f4f4f6; }
.card .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; pointer-events: none; -webkit-user-drag: none; }
.photo.loading::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.6) 50%, transparent 70%) var(--line);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite; z-index: 2; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -80% 0; } }
.dots { position: absolute; top: 8px; left: 14px; right: 14px; z-index: 3; display: flex; gap: 4px; pointer-events: none; }
.dots i { flex: 1; height: 3px; border-radius: 3px; background: rgba(4, 0, 55, .16); }
.dots i.on { background: var(--ink); }
.promo { position: absolute; top: 20px; left: 14px; z-index: 2; background: var(--red); color: #fff; font-size: .85rem; font-weight: 700; padding: 6px 11px; border-radius: 50px; font-variant-numeric: tabular-nums; }
.card-tools { position: absolute; top: 18px; right: 12px; z-index: 3; display: flex; align-items: center; border-radius: 50px; padding: 4px; }
.card-tools button, .card-tools a { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); padding: 0; }
.tap-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 2; background: rgba(4, 0, 55, .8); color: #fff; font-size: .76rem; padding: 6px 12px; border-radius: 50px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.card .info { padding: 12px 16px 14px; display: flex; flex-direction: column; justify-content: center; gap: 10px; flex: 1; min-height: 0; }
.headline { display: flex; align-items: baseline; gap: 12px; }
.name-btn { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); display: block; }
.card .name { display: block; font-weight: 600; font-size: 1.02rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .price .now { font-size: 1.12rem; letter-spacing: -.01em; }
.card .price s { font-size: .82rem; }
.price { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.price .now { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -.02em; }
.price.is-promo .now { color: var(--red); }
.price s { color: var(--muted); font-size: .88rem; }
.swatches { display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 3px; margin: -3px; }
.swatches::-webkit-scrollbar { display: none; }
.swatches button { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--soft); padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.swatches .cname { flex-shrink: 0; font-size: .88rem; color: var(--muted); text-transform: capitalize; white-space: nowrap; }
.card.under { transform: scale(.95) translateY(10px); opacity: .7; }
.card.top { cursor: grab; z-index: 2; }
.card.fly { transition: transform .32s cubic-bezier(.4, 0, .6, 1), opacity .32s; }
.card.back { transition: transform .25s cubic-bezier(.2, .9, .3, 1.3); }
.stamp { position: absolute; top: 70px; padding: 6px 14px; border: 3px solid currentColor; border-radius: 14px; z-index: 4; font-weight: 800; font-size: 1.6rem; text-transform: uppercase; opacity: 0; background: rgba(255,255,255,.85); pointer-events: none; }
.stamp.yes { left: 18px; color: var(--ink); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--red); transform: rotate(12deg); }

.controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
.verdict { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; padding: 0; transition: transform .12s; }
.verdict svg { width: 26px; height: 26px; }
.verdict span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.verdict.no { color: var(--ink); }
.verdict.yes { background: var(--ink); color: #fff; border: 0; box-shadow: var(--shadow-s); }
.verdict:active, .verdict.flash { transform: scale(.94); }
.undo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0; }
.undo svg { width: 20px; height: 20px; } .undo:disabled { opacity: .35; cursor: default; }

/* ---------- États (chargement, fin, vide) ---------- */
.state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
.state h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.state p { margin: 0; color: var(--muted); max-width: 34ch; line-height: 1.5; }
.state .stack { display: flex; flex-direction: column; gap: 10px; width: min(100%, 340px); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 50px; padding: 15px 18px; font-weight: 700; font-size: 1.02rem; text-decoration: none; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px -4px rgba(4,0,55,.18); }
.btn.link { background: none; color: var(--muted); font-weight: 600; padding: 8px; }
.empty-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 40px 10px 10px; }
.empty-hero svg { width: 46px; height: 46px; color: var(--red); }
.empty-hero h3 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; letter-spacing: -.02em; color: var(--red); margin: 0; }
.empty-hero p { margin: 0; color: var(--ink); line-height: 1.5; max-width: 32ch; font-size: 1.02rem; }

/* ---------- Barre d'onglets flottante ---------- */
.tabbar { position: fixed; z-index: 30; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin: 0 auto; border-radius: 36px; padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tabbar button { position: relative; border: 0; background: transparent; border-radius: 30px; padding: 8px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); font-size: .78rem; font-weight: 500; }
.tabbar button[aria-current="page"] { background: var(--active); font-weight: 700; }
.tabbar .badge { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--red); color: #fff; border-radius: 50px; min-width: 18px; padding: 1px 5px; font-size: .68rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Pages Envies / Styles / Looks ---------- */
.coll { position: fixed; inset: 0; z-index: 18; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabbar) + 10px) max(16px, env(safe-area-inset-left, 0px)); }
.coll-inner { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; flex: 1; }
.coll-head { text-align: center; }
.coll-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; margin: 6px 0 0; }
.coll-head .n { display: block; font-weight: 500; font-size: .85rem; color: var(--muted); margin-top: 2px; }
.coll-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.thumb { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 20px; overflow: hidden; padding: 0; border: 0; background: var(--surface); box-shadow: 0 4px 14px -8px rgba(4,0,55,.25); }
.thumb { background: #f4f4f6; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.thumb .tag { position: absolute; left: 8px; bottom: 8px; font-size: .78rem; font-weight: 700; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ink); padding: 4px 9px; border-radius: 50px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: .92rem; margin: 0; text-align: center; line-height: 1.5; }
.profile, .uni, .look { background: var(--surface); border-radius: 24px; box-shadow: 0 4px 14px -8px rgba(4,0,55,.2); }
.profile { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.profile-name { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.profile-desc { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 7px 10px; align-items: center; font-size: .85rem; }
.bar { height: 8px; border-radius: 50px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 50px; }
.bars .pct { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.palette { display: flex; flex-wrap: wrap; gap: 10px; }
.palette span { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.palette b { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: block; }
.sec-title { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; margin: 6px 0 0; }
.sec-sub { margin: -8px 0 0; font-size: .85rem; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.uni { padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.uni-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 6px; flex-wrap: wrap; }
.uni-head strong { font-weight: 800; font-size: 1rem; }
.uni-head span { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mosaic .thumb { border-radius: 12px; }
.look { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.look-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.look-head strong { font-weight: 800; font-size: 1.05rem; }
.look-head span { font-size: .8rem; color: var(--muted); }
.look-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.look-row .thumb { border-radius: 12px; }
.look-items { margin: 0; font-size: .82rem; color: var(--muted); line-height: 1.4; }
.pill { border: 0; background: var(--active); color: var(--ink); border-radius: 50px; padding: 10px 16px; font-weight: 700; font-size: .9rem; }
.pill.dark { background: var(--ink); color: #fff; }

/* ---------- Fiche article (plein écran, comme la fiche produit Kiabi) ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--surface); overflow-y: auto; }
.sheet-top { position: relative; }
.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gallery img { flex: 0 0 100%; width: 100%; height: min(64vh, 133vw); object-fit: contain; background: #f4f4f6; scroll-snap-align: center; }
.gdots { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; display: flex; gap: 5px; padding: 6px 9px; border-radius: 50px; }
.gdots i { width: 7px; height: 7px; border-radius: 50px; background: var(--soft); transition: width .2s; }
.gdots i.on { width: 20px; background: var(--ink); }
.sheet-back { position: absolute; z-index: 3; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; padding: 0; color: var(--ink); }
.sheet-tools { position: absolute; z-index: 3; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 4px; border-radius: 50px; padding: 4px 6px; }
.sheet-tools button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; padding: 0; color: var(--ink); }
.sheet-tools .liked svg { fill: var(--red); color: var(--red); }
.sheet-body { max-width: 560px; margin: 0 auto; padding: 4px max(20px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.cthumbs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 3px; }
.cthumbs button { flex: 0 0 auto; width: 64px; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; padding: 0; border: 2px solid transparent; background: var(--line); }
.cthumbs button[aria-pressed="true"] { border-color: var(--ink); }
.cthumbs img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.sheet-colour { font-size: 1rem; color: var(--muted); margin: 0; }
.sheet-colour b { color: var(--ink); text-transform: capitalize; }
.sheet-title { font-weight: 400; font-size: 1.45rem; line-height: 1.25; margin: 0; }
.sheet-body .price .now { font-size: 2rem; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 45; display: flex; align-items: center; gap: 10px;
  border-radius: 50px; padding: 6px 6px 6px 8px; max-width: calc(100% - 32px); animation: toastIn .25s ease-out; color: var(--ink); }
.toast img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--line); }
.toast span { font-size: .9rem; font-weight: 600; white-space: nowrap; padding-right: 4px; }
.toast a { background: var(--ink); color: #fff; border-radius: 50px; padding: 9px 15px; font-weight: 700; font-size: .88rem; white-space: nowrap; text-decoration: none; }

/* ---------- Animation d'ouverture : les lettres sautent en arc, le mot craque, le K arrive ---------- */
.splash { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.splash-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.word { display: flex; font-family: var(--font-display); font-weight: 800; letter-spacing: -.04em; font-size: clamp(3rem, 15vw, 5rem); letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.word .l { display: inline-block; transform-origin: 50% 100%; opacity: 0; }
.splash .by { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; color: var(--muted); align-self: flex-end; margin-right: 4px; }
.splash .by span { opacity: 0; }
.splash .by img { height: 46px; width: auto; opacity: 0; transform-origin: 50% 100%; }
.trails { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.trails path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.splash .skip { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: .78rem; color: var(--soft); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .photo.loading::after { animation: none; } .card.fly, .card.back { transition: none; } }
@media (max-width: 380px) { .brand b { font-size: 1.35rem; } .tabbar button { font-size: .72rem; } }
</style>
</head>
<body>

<div class="splash" id="splash" role="img" aria-label="Craquage by Kiabi">
  <div class="splash-inner" id="splash-inner">
    <div class="word" id="word" aria-hidden="true"></div>
    <div class="by"><span>by</span><img id="splash-k" src="assets/kiabi-k.svg" alt=""></div>
  </div>
  <div class="skip">Touchez pour passer</div>
</div>

<div class="app">
  <header>
    <a class="brand" href="./" aria-label="Craquage by Kiabi"><b>Craquage</b><span>by</span><img src="assets/kiabi-k.svg" alt="Kiabi"></a>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Catégories"></div>

  <section class="state" id="loading">
    <h2>Chargement…</h2>
    <p>On prépare les dernières nouveautés Kiabi.</p>
  </section>
  <section class="state" id="error" hidden>
    <h2>Pas de connexion</h2>
    <p>Impossible de charger les articles. Vérifie ta connexion internet, puis réessaie.</p>
    <div class="stack"><button class="btn primary" type="button" onclick="location.reload()">Réessayer</button></div>
  </section>

  <section id="swipe-view" style="display:none">
    <div class="stage"><div class="deck" id="deck"></div></div>
    <div class="controls">
      <button class="verdict no glass" id="btn-no" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>No go</span>
      </button>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const eur = n => n.toFixed(2).replace('.', ',') + ' €';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = 'https://static.kiabi.com/images/';
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

  // ---------- Animation d'ouverture ----------
  function playSplash() {
    const sp = $('splash'), inner = $('splash-inner'), word = $('word'), byTxt = sp.querySelector('.by span'), K = $('splash-k');
    let done = false;
    const finish = () => { if (done) return; done = true; sp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, fill: 'forwards' }).onfinish = () => sp.remove(); };
    sp.addEventListener('click', finish);
    const letters = [...'Craquage'].map(ch => { const s = document.createElement('span'); s.className = 'l'; s.textContent = ch; word.appendChild(s); return s; });
    if (reduced || !sp.animate) { letters.forEach(l => l.style.opacity = 1); byTxt.style.opacity = 1; K.style.opacity = 1; return setTimeout(finish, 1100); }
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('class', 'trails'); inner.appendChild(svg);
    const box = el => { const r = el.getBoundingClientRect(), o = inner.getBoundingClientRect(); return { x: r.left - o.left + r.width / 2, y: r.top - o.top + r.height / 2, h: r.height }; };
    // trait de vitesse : se dessine derrière l'élément puis s'efface
    function trail(d, delay, dur) {
      const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.appendChild(p);
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0, offset: .55 }, { strokeDashoffset: -len }], { duration: dur, delay, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' });
    }
    // saut en arc : départ décalé, sommet, atterrissage écrasé, rebond
    function jump(el, from, delay, dur) {
      el.animate([
        { opacity: 0, transform: `translate(${from[0]}px, ${from[1]}px) rotate(${from[2]}deg)` },
        { opacity: 1, transform: `translate(${from[0] * .45}px, ${-Math.abs(from[1]) * .55 - 40}px) rotate(${from[2] * .4}deg)`, offset: .45 },
        { opacity: 1, transform: 'translate(0, 0) rotate(0) scale(1.15, .82)', offset: .78 },
        { opacity: 1, transform: 'translate(0, -6px) rotate(0) scale(.96, 1.05)', offset: .9 },
        { opacity: 1, transform: 'translate(0, 0) rotate(0) scale(1)' }
      ], { duration: dur, delay, easing: 'cubic-bezier(.33,.66,.55,1)', fill: 'both' });
    }
    letters.forEach((l, i) => jump(l, [-30 - (7 - i) * 6, 70 + (i % 3) * 25, -25 + i * 4], 120 + i * 70, 620));
    const c = box(letters[0]);
    trail(`M ${c.x - 70} ${c.y + 120} Q ${c.x - 60} ${c.y - 150} ${c.x + 10} ${c.y - 110}`, 60, 640);
    // le mot craque : chaque lettre se penche un peu, petite secousse
    const crackAt = 120 + 7 * 70 + 620 + 40;
    const tilt = [-7, 5, -4, 8, -6, 4, -8, 6], lift = [2, -3, 1, -4, 3, -2, 1, -3];
    letters.forEach((l, i) => l.animate([{ transform: 'rotate(0) translateY(0)' }, { transform: `rotate(${tilt[i] * 1.6}deg) translateY(${lift[i] * 1.8}px)`, offset: .35 },
      { transform: `rotate(${tilt[i]}deg) translateY(${lift[i]}px)` }], { duration: 380, delay: crackAt, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards', composite: 'add' }));
    word.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(-2px)' }, { transform: 'translateX(0)' }], { duration: 260, delay: crackAt });
    // « by » puis le K arrive de loin en grand arc
    byTxt.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: crackAt + 200, fill: 'both' });
    const k = box(K);
    trail(`M ${k.x + 190} ${k.y + 70} Q ${k.x + 70} ${k.y - 46} ${k.x + 8} ${k.y - 2}`, crackAt + 180, 700);
    K.animate([
      { opacity: 0, transform: 'translate(180px, 60px) rotate(40deg)' },
      { opacity: 1, transform: 'translate(64px, -26px) rotate(14deg)', offset: .5 },
      { opacity: 1, transform: 'translate(0, 0) rotate(0) scale(1.18, .8)', offset: .8 },
      { opacity: 1, transform: 'translate(0, -5px) scale(.95, 1.06)', offset: .9 },
      { opacity: 1, transform: 'translate(0, 0) scale(1)' }
    ], { duration: 620, delay: crackAt + 240, easing: 'cubic-bezier(.33,.66,.55,1)', fill: 'both' });
    setTimeout(finish, crackAt + 240 + 620 + 650);
  }
  playSplash();

  // ---------- Données ----------
  let PRODUCTS = [], byId = new Map();
  const SW = { 'écru': '#efe8d8', 'blanc': '#f7f7f4', 'noir': '#1b1b1b', 'marine': '#1f2a4a', 'bleu clair': '#b9cbe8', 'denim': '#3d5a8a', 'bleu': '#4f74b3', 'gris': '#8a8d92',
    'beige': '#d8c3a5', 'camel': '#b48a5f', 'marron': '#5a3a2a', 'taupe': '#9b8b7a', 'kaki': '#7a7a32', 'vert': '#5f7a4f', 'bordeaux': '#6e1f2b', 'rouge': '#c0392b',
    'rose': '#e7a3b5', 'jaune': '#ecd36a', 'orange': '#e07b39', 'violet': '#8a6bb0',
    'léopard': 'linear-gradient(135deg,#c9a777 30%,#3b2a1c 30% 40%,#c9a777 40% 70%,#3b2a1c 70% 80%,#c9a777 80%)', 'multicolore': 'conic-gradient(#ed2237,#ecd36a,#5f7a4f,#4f74b3,#ed2237)' };
  const CATS = [['all', 'Tout'], ['deal', 'Bons plans'], ['robe', 'Robes'], ['pull', 'Pulls & gilets'], ['haut', 'Hauts & chemises'], ['pantalon', 'Pantalons & jeans'],
    ['jupe', 'Jupes'], ['veste', 'Manteaux & vestes'], ['chaussures', 'Chaussures'], ['accessoire', 'Accessoires']];
  const LOOK = { haut: 'haut', pull: 'haut', robe: 'robe', pantalon: 'bas', jupe: 'bas', veste: 'veste', chaussures: 'extra', accessoire: 'extra' };
  const photo = (c, size, k = 0) => IMG + c.i + '_' + size + (c.x[k] || c.x[0] || 1) + '.jpg';
  const discount = c => { const now = Math.min(...c.p), was = Math.max(...c.p); return was > now ? Math.round((1 - now / was) * 100) : 0; };

  // ---------- État ----------
  const KEY = 'craquage-kiabi-v1';
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let order = [], history = [], verdicts = {}, chosen = {}, cat = 'all', busy = false;
  const broken = new Set(), photoIdx = {};
  const colorIdx = id => Math.min(chosen[id] || 0, byId.get(id).c.length - 1);
  const curColor = id => byId.get(id).c[colorIdx(id)];
  const matches = id => {
    const p = byId.get(id); if (broken.has(id)) return false;
    if (cat === 'all') return true;
    if (cat === 'deal') return p.c.some(c => discount(c) >= 30);
    return p.k === cat;
  };
  const upcoming = n => { const out = []; for (const id of order) { if (!verdicts[id] && matches(id)) { out.push(id); if (out.length >= n) break; } } return out; };
  const currentId = () => upcoming(1)[0];
  const goIds = () => order.filter(id => verdicts[id] === 'yes' && !broken.has(id));
  let saveTimer = null;
  const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set(KEY, { order, history, verdicts, chosen, cat }), 400); };

  // ---------- Photos (avec repli si une image Kiabi manque) ----------
  function setPhoto(img, id, size, onFail) {
    const c = curColor(id), key = id + ':' + colorIdx(id) + ':' + size;
    let k = photoIdx[key] || 0;
    img.onerror = () => {
      k++; photoIdx[key] = k;
      if (k < c.x.length) img.src = photo(c, size, k);
      else if (size === 'hd') { img.onerror = () => onFail && onFail(); img.src = photo(c, 'fr', 0); }
      else onFail && onFail();
    };
    img.src = photo(c, size, k);
  }
  const preload = id => { const im = new Image(); im.src = photo(curColor(id), 'hd', photoIdx[id + ':' + colorIdx(id) + ':hd'] || 0); };
  function markBroken(id) { if (broken.has(id)) return; broken.add(id); if (!verdicts[id]) render(); }

  // ---------- Plusieurs photos par couleur ----------
  const badPhoto = new Set(), photoPos = {}, viewed = {};
  const photosOf = c => c.x.filter(n => !badPhoto.has(c.i + '_' + n));
  function showCardPhoto(el, id) {
    const c = curColor(id), list = photosOf(c), ph = el.querySelector('.photo'), img = ph.querySelector('img');
    if (!list.length) return markBroken(id);
    const pi = Math.min(photoPos[id] || 0, list.length - 1); photoPos[id] = pi;
    ph.classList.add('loading'); img.onload = () => ph.classList.remove('loading');
    img.onerror = () => { badPhoto.add(c.i + '_' + list[pi]); showCardPhoto(el, id); };
    img.src = IMG + c.i + '_hd' + list[pi] + '.jpg';
    const dots = el.querySelector('.dots'); dots.hidden = list.length < 2; dots.innerHTML = list.map((_, j) => `<i class="${j === pi ? 'on' : ''}"></i>`).join('');
    if (list[pi + 1]) { const im = new Image(); im.src = IMG + c.i + '_hd' + list[pi + 1] + '.jpg'; }   // photo suivante prête
  }

  // ---------- Algorithme de préférences (appris sur cet appareil) ----------
  // Chaque geste ajuste le poids des caractéristiques de l'article (catégorie, couleur, style, prix, promo) ;
  // les prochaines cartes sont triées par affinité, avec une part de hasard pour continuer à surprendre.
  const PREF_KEY = 'craquage-prefs-v1';
  const prefs = store.get(PREF_KEY) || { w: {}, n: 0 };
  const band = v => v < 15 ? 'p:<15' : v < 30 ? 'p:15-30' : v < 50 ? 'p:30-50' : 'p:50+';
  function feats(id, ci) {
    const p = byId.get(id), c = p.c[ci == null ? colorIdx(id) : ci];
    return ['k:' + p.k, 'f:' + c.f, ...p.t.map(t => 't:' + t), band(Math.min(...c.p)), discount(c) >= 30 ? 'd:deal' : 'd:full'];
  }
  function learn(id, amount) {
    if (!byId.has(id)) return;
    feats(id).forEach(f => { prefs.w[f] = Math.max(-8, Math.min(8, (prefs.w[f] || 0) + amount)); });
    prefs.n++; store.set(PREF_KEY, prefs);
  }
  function affinity(id) {
    const p = byId.get(id); let best = -Infinity;
    p.c.forEach((_, ci) => { const f = feats(id, ci); const v = f.reduce((s, x) => s + (prefs.w[x] || 0), 0) / Math.sqrt(f.length); if (v > best) best = v; });
    return best;
  }
  function rerank() {
    if (prefs.n < 4) return;                                   // il faut quelques gestes avant de personnaliser
    const win = order.filter(id => !verdicts[id] && matches(id));   // toutes les cartes restantes de la catégorie
    if (win.length < 3) return;
    const ranked = win.map(id => ({ id, s: affinity(id) + Math.random() * 1.4 })).sort((a, b) => b.s - a.s).map(x => x.id);
    for (let i = 3; i < ranked.length; i += 4) {                // 1 carte sur 4 : découverte au hasard
      const j = i + Math.floor(Math.random() * (ranked.length - i)); [ranked[i], ranked[j]] = [ranked[j], ranked[i]];
    }
    const inWin = new Set(win), slots = []; order.forEach((id, i) => { if (inWin.has(id)) slots.push(i); });
    slots.forEach((pos, k) => { order[pos] = ranked[k]; });
  }
  function topTastes() {
    const label = { k: { robe: 'les robes', pull: 'les pulls et gilets', haut: 'les hauts', pantalon: 'les pantalons', jupe: 'les jupes', veste: 'les manteaux et vestes', chaussures: 'les chaussures', accessoire: 'les accessoires' } };
    return Object.entries(prefs.w).filter(([, v]) => v > 1).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([f]) => {
      const [t, v] = f.split(':');
      if (t === 'k') return label.k[v]; if (t === 'f') return 'le ' + v; if (t === 't') return 'le style ' + (STYLE[v] ? STYLE[v][0].toLowerCase() : v);
      if (t === 'd') return v === 'deal' ? 'les bons plans' : null; if (t === 'p') return 'les prix ' + v.replace('<', 'sous ').replace('+', ' € et plus').replace(/(\d+)-(\d+)/, 'entre $1 et $2 €');
      return null;
    }).filter(Boolean);
  }

  // ---------- Couleurs ----------
  function swatchButtons(id, onPick) {
    const p = byId.get(id), frag = document.createDocumentFragment();
    p.c.forEach((c, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.style.background = SW[c.f] || '#b3b2c2';
      b.setAttribute('aria-label', 'Couleur ' + c.c); b.title = c.c; b.setAttribute('aria-pressed', String(k === colorIdx(id)));
      b.addEventListener('pointerdown', e => e.stopPropagation());
      b.addEventListener('click', e => { e.stopPropagation(); chosen[id] = k; onPick(); save(); });
      frag.appendChild(b);
    });
    return frag;
  }
  const priceHtml = c => { const now = Math.min(...c.p), was = Math.max(...c.p); return `<span class="now">${eur(now)}</span>` + (was > now ? `<s>${eur(was)}</s>` : ''); };

  // ---------- Partage ----------
  async function share(id) {
    learn(id, 1);
    const p = byId.get(id), c = curColor(id), text = `Regarde ce que j’ai trouvé sur Kiabi : ${p.n} à ${eur(Math.min(...c.p))}`;
    try {
      if (navigator.share) { await navigator.share({ title: p.n, text, url: c.u }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + c.u); flash('Lien copié, colle-le dans un message'); }
    catch (e) { flash('Copie impossible : ' + c.u); }
  }
  function flash(msg) {
    const t = $('toast'); $('toast-img').hidden = true; $('toast-buy').hidden = true; $('toast-text').textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 2600);
  }

  // ---------- Carte ----------
  let hintShown = !!store.get('craquage-hint');
  function fillCard(el, id) {
    const p = byId.get(id), c = curColor(id), k = colorIdx(id), d = discount(c);
    showCardPhoto(el, id); el.querySelector('.photo img').alt = p.n + ', ' + c.c;
    const promo = el.querySelector('.promo'); promo.hidden = !d; promo.textContent = d ? '−' + d + ' %' : '';
    el.querySelector('.tap-hint').hidden = !(photosOf(c).length > 1 && !hintShown && el.classList.contains('top'));
    el.querySelector('.name').textContent = p.n;
    const pr = el.querySelector('.price'); pr.className = 'price' + (d ? ' is-promo' : ''); pr.innerHTML = priceHtml(c);
    el.querySelector('.buy').href = c.u;
    const sw = el.querySelector('.swatches'); sw.innerHTML = ''; sw.appendChild(swatchButtons(id, () => { photoPos[id] = 0; learn(id, .1); fillCard(el, id); }));
    const cn = document.createElement('span'); cn.className = 'cname'; cn.textContent = c.c; sw.appendChild(cn);
    if (el.classList.contains('top')) p.c.forEach((cc, j) => { if (j !== k) { const im = new Image(); im.src = photo(cc, 'hd', 0); } });
  }
  function makeCard(id, cls) {
    const el = document.createElement('article'); el.className = 'card ' + cls;
    el.innerHTML = `<div class="photo"><img alt="" draggable="false"><span class="promo" hidden></span><div class="dots" hidden></div>
      <div class="card-tools glass"><button class="share" type="button" aria-label="Envoyer à une amie"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></button>
      <a class="buy" target="_blank" rel="noopener" aria-label="Acheter sur kiabi.com"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 01-1.5 1.3H7.7a1.5 1.5 0 01-1.5-1.3L5 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg></a></div>
      <span class="tap-hint" hidden>Touche pour d’autres photos</span><div class="stamp yes">Go</div><div class="stamp no">No go</div></div>
      <div class="info"><div class="headline"><button class="name-btn" type="button"><span class="name"></span></button><div class="price"></div></div>
      <div class="swatches" role="group" aria-label="Couleurs"></div></div>`;
    el.querySelectorAll('.buy, .share, .name-btn').forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));
    el.querySelector('.name-btn').addEventListener('click', e => { e.stopPropagation(); openSheet(id); });
    el.querySelector('.share').addEventListener('click', e => { e.stopPropagation(); share(id); });
    el.querySelector('.buy').addEventListener('click', () => learn(id, 1.5));
    fillCard(el, id);
    return el;
  }

  function render() {
    save();
    const deckEl = $('deck'); deckEl.querySelectorAll('.card').forEach(n => n.remove());
    const next = upcoming(4), done = next.length === 0;
    $('swipe-view').style.display = done ? 'none' : 'contents';
    $('end').hidden = !done;
    $('btn-undo').disabled = history.length === 0;
    const nGo = goIds().length; $('coll-count').textContent = nGo; $('coll-count').hidden = !nGo;
    renderChips();
    if (done) {
      const label = (CATS.find(c => c[0] === cat) || CATS[0])[1], n = goIds().length;
      $('end-title').textContent = cat === 'all' ? 'Tu as tout vu !' : `Tu as tout vu dans « ${label} »`;
      $('end-text').textContent = `${n} article${n > 1 ? 's' : ''} dans tes envies. De nouveaux articles arrivent chaque jour.`;
      $('end-all').hidden = cat === 'all';
      $('end-restart').hidden = !Object.values(verdicts).includes('no');
      return;
    }
    if (next[1]) deckEl.appendChild(makeCard(next[1], 'under'));
    const top = makeCard(next[0], 'top'); deckEl.appendChild(top); attachDrag(top);
    next.slice(2).forEach(preload);
  }
  function renderChips() {
    const box = $('chips'); box.innerHTML = '';
    CATS.forEach(([k, label]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (k === 'deal' ? ' deal' : '');
      b.textContent = label; b.setAttribute('aria-pressed', String(cat === k));
      b.onclick = () => { cat = k; hideToast(); rerank(); render(); };
      box.appendChild(b);
    });
    const on = box.querySelector('.chip[aria-pressed="true"]');
    if (on) box.scrollLeft = Math.max(0, on.offsetLeft - box.clientWidth / 2 + on.offsetWidth / 2);
  }

  function decide(choice) {
    const id = currentId(); if (busy || !id) return;
    const top = $('deck').querySelector('.card.top');
    const btn = $(choice === 'yes' ? 'btn-yes' : 'btn-no'); btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 160);
    const commit = () => { verdicts[id] = choice; history.push({ id, choice }); learn(id, choice === 'yes' ? 1 : -.6); rerank(); busy = false; render(); if (choice === 'yes') showToast(id); else hideToast(); };
    if (!top || reduced) return commit();
    busy = true;
    const dir = choice === 'yes' ? 1 : -1;
    top.querySelector('.stamp.' + choice).style.opacity = 1;
    top.classList.add('fly'); top.style.transform = `translate(${dir * 140}%, -4%) rotate(${dir * 24}deg)`; top.style.opacity = 0;
    setTimeout(commit, 300);
  }
  function undo() {
    if (busy || !history.length) return;
    const last = history.pop(); delete verdicts[last.id];
    order = [last.id].concat(order.filter(x => x !== last.id));
    if (!matches(last.id)) cat = 'all';
    hideToast(); render();
  }
  function attachDrag(card) {
    let x0 = 0, y0 = 0, dx = 0, dy = 0, active = false, onPhoto = false;
    const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
    card.addEventListener('pointerdown', e => {
      if (busy) return; active = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; onPhoto = !!e.target.closest('.photo');
      card.setPointerCapture(e.pointerId); card.classList.remove('back');
    });
    card.addEventListener('pointermove', e => {
      if (!active) return; dx = e.clientX - x0; dy = e.clientY - y0;
      card.style.transform = `translate(${dx}px, ${dy * .35}px) rotate(${dx / 18}deg)`;
      const t = Math.min(Math.abs(dx) / 110, 1); yes.style.opacity = dx > 0 ? t : 0; no.style.opacity = dx < 0 ? t : 0;
    });
    const end = () => {
      if (!active) return; active = false;
      if (Math.abs(dx) > Math.min(110, card.offsetWidth * .28)) return decide(dx > 0 ? 'yes' : 'no');
      card.classList.add('back'); card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6 && onPhoto) {          // toucher la photo : à droite = photo suivante, à gauche = précédente
        const id = currentId(), n = photosOf(curColor(id)).length;
        if (n > 1) {
          const r = card.getBoundingClientRect(), back = x0 - r.left < r.width / 3;
          photoPos[id] = ((photoPos[id] || 0) + (back ? -1 : 1) + n) % n; showCardPhoto(card, id);
          viewed[id] = (viewed[id] || 0) + 1; if (viewed[id] <= 3) learn(id, .08);   // la curiosité compte un peu
          if (!hintShown) { hintShown = true; store.set('craquage-hint', 1); card.querySelector('.tap-hint').hidden = true; }
        }
      }
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }
  $('btn-yes').onclick = () => decide('yes');
  $('btn-no').onclick = () => decide('no');
  $('btn-undo').onclick = undo;
  document.addEventListener('keydown', e => {
    if (!$('sheet').hidden || !$('coll').hidden) { if (e.key === 'Escape') { if (!$('sheet').hidden) closeSheet(); else navTo('swipe'); } return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); decide('yes'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); decide('no'); }
    else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
  });
  $('end-restart').onclick = () => { Object.keys(verdicts).forEach(id => { if (verdicts[id] === 'no') delete verdicts[id]; }); history = history.filter(h => h.choice === 'yes'); render(); };
  $('end-all').onclick = () => { cat = 'all'; render(); };
  $('end-coll').onclick = () => openColl();

  // ---------- Mes envies ----------
  function thumbBtn(id, label) {
    const c = curColor(id), b = document.createElement('button'); b.className = 'thumb'; b.type = 'button';
    b.setAttribute('aria-label', byId.get(id).n + ', ' + c.c);
    b.innerHTML = `<img alt="" loading="lazy"><span class="tag">${esc(label || eur(Math.min(...c.p)))}</span>`;
    setPhoto(b.querySelector('img'), id, 'fr'); b.onclick = () => openSheet(id);
    return b;
  }
  function renderColl() {
    const ids = goIds().slice().reverse(), grid = $('coll-grid');
    $('coll-n').textContent = ids.length ? `${ids.length} article${ids.length > 1 ? 's' : ''} · enregistrés sur ce téléphone` : '';
    grid.innerHTML = ''; ids.forEach(id => grid.appendChild(thumbBtn(id)));
    if (!ids.length) {
      grid.innerHTML = `<div class="empty-hero" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg><h3>Mes envies</h3>
        <p>Glisse à droite les articles qui te font craquer : ils t’attendront ici.</p><div class="stack" style="width:min(100%,320px);margin-top:12px"><button class="btn primary" type="button" id="empty-go">Commencer à swiper</button></div></div>`;
      $('empty-go').onclick = () => navTo('swipe');
    }
  }
  const TITLES = { items: 'Mes envies', styles: 'Mon style' };
  function navTo(which) {
    hideToast(); if (!$('sheet').hidden) closeSheet();
    ['swipe', 'items', 'styles'].forEach(t => { const b = $('nav-' + t); if (t === which) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (which === 'swipe') { $('coll').hidden = true; return; }
    $('coll-title').textContent = TITLES[which]; $('coll-n').textContent = '';
    ['items', 'styles'].forEach(t => { $('pane-' + t).hidden = t !== which; });
    if (which === 'items') renderColl(); if (which === 'styles') renderStyles();
    $('coll').hidden = false;
  }
  ['swipe', 'items', 'styles'].forEach(t => { $('nav-' + t).onclick = () => navTo(t); });
  const openColl = () => navTo('items');

  // ---------- Mes styles ----------
  const STYLE = { cosy: ['Cocooning', 'mailles douces et pièces chaudes'], chic: ['Chic', 'coupes nettes et pièces habillées'], casual: ['Casual', 'des pièces faciles à porter tous les jours'],
    retro: ['Rétro', 'velours, volants et imprimés vintage'], preppy: ['Preppy', 'rayures, carreaux et esprit college'], minimal: ['Minimaliste', 'des lignes simples et des couleurs sobres'],
    rock: ['Rock', 'effet cuir, vinyle et léopard'], glam: ['Glam', 'des matières qui brillent'], sport: ['Sporty', 'sweats, doudounes et confort'] };
  const NEUTRAL = new Set(['noir', 'blanc', 'écru', 'beige', 'gris', 'marine', 'denim', 'camel', 'taupe', 'marron', 'léopard']);
  const CATLABEL = { haut: 'haut', bas: 'bas', veste: 'veste', robe: 'robe', extra: 'touche finale' };
  const meta = id => { const p = byId.get(id); return { cat: LOOK[p.k], tags: p.t.length ? p.t : ['casual'], col: curColor(id).f }; };
  function pairScore(a, b) {
    const A = meta(a), B = meta(b), shared = A.tags.filter(t => B.tags.includes(t)).length;
    return shared * 2 + ((NEUTRAL.has(A.col) || NEUTRAL.has(B.col) || A.col === B.col) ? 1 : -1) + (A.tags[0] === B.tags[0] ? 1 : 0);
  }
  function buildLooks(ids) {
    const by = c => ids.filter(i => meta(i).cat === c), usage = new Map();
    const best = (pool, look) => { let top = null, sc = -Infinity;
      for (const p of pool) { if (look.includes(p) || (usage.get(p) || 0) >= 2) continue;
        const v = look.reduce((s, l) => s + pairScore(l, p), 0) / look.length - (usage.get(p) || 0) * 1.5; if (v > sc) { sc = v; top = p; } }
      return sc > 0 ? top : null; };
    const looks = [];
    for (const a of [...by('robe'), ...by('haut')]) {
      const look = [a];
      if (meta(a).cat === 'haut') { const b = best(by('bas'), look); if (b) look.push(b); }
      const v = best(by('veste'), look); if (v) look.push(v);
      const x = best(by('extra'), look); if (x) look.push(x);
      if (look.length < 2) continue;
      looks.push({ look, score: look.slice(1).reduce((s, x) => s + pairScore(a, x), 0) / (look.length - 1) + look.length * .5 });
      look.forEach(x => usage.set(x, (usage.get(x) || 0) + 1));
    }
    return looks.sort((x, y) => y.score - x.score).slice(0, 6).map(({ look }) => {
      const count = {}; look.forEach(x => meta(x).tags.forEach((t, k) => count[t] = (count[t] || 0) + (k ? 1 : 2)));
      return { look, tag: Object.keys(count).sort((p, q) => count[q] - count[p])[0] };
    });
  }
  function renderStyles() {
    const pane = $('pane-styles'); pane.innerHTML = '';
    const ids = goIds();
    if (ids.length >= 2) {
      const w = {}; let total = 0;
      ids.forEach(id => meta(id).tags.forEach((t, k) => { const v = k ? 1 : 2; w[t] = (w[t] || 0) + v; total += v; }));
      const ranked = Object.keys(w).sort((a, b) => w[b] - w[a]), [t1, t2] = ranked, share1 = w[t1] / total;
      const name = (!t2 || share1 > .55) ? STYLE[t1][0] : `${STYLE[t1][0]} × ${STYLE[t2][0]}`;
      const desc = t2 && share1 <= .55 ? `Tu craques surtout pour ${STYLE[t1][1]}, avec une touche ${STYLE[t2][0].toLowerCase()}.` : `Tu craques surtout pour ${STYLE[t1][1]}.`;
      const cols = {}; ids.forEach(id => { const f = meta(id).col; cols[f] = (cols[f] || 0) + 1; });
      const palette = Object.keys(cols).sort((a, b) => cols[b] - cols[a]).slice(0, 5);
      const prof = document.createElement('section'); prof.className = 'profile';
      prof.innerHTML = `<p class="eyebrow">D’après ${ids.length} coups de cœur</p><p class="profile-name">${esc(name)}</p><p class="profile-desc">${esc(desc)}</p>
        <div class="palette">${palette.map(c => `<span><b style="background:${SW[c] || '#999'}"></b>${esc(c)}</span>`).join('')}</div>`;
      pane.appendChild(prof);
    }
    // looks enregistrés, puis looks proposés
    const saved = savedLooks.map(l => ({ ...l, items: l.items.filter(x => byId.has(x.id)) })).filter(l => l.items.length >= 2);
    if (saved.length) {
      const h = document.createElement('h3'); h.className = 'sec-title'; h.textContent = 'Mes looks'; pane.appendChild(h);
      saved.forEach((L, n) => {
        L.items.forEach(x => { if (chosen[x.id] == null) chosen[x.id] = x.k; });
        const total = L.items.reduce((s, x) => s + Math.min(...byId.get(x.id).c[Math.min(x.k, byId.get(x.id).c.length - 1)].p), 0);
        pane.appendChild(lookCard(`Look ${saved.length - n}`, L.items.map(x => x.id), total, 'Supprimer', () => {
          savedLooks = savedLooks.filter(l => lookKey(l.items) !== lookKey(L.items)); store.set(LOOKS_KEY, savedLooks); renderStyles();
        }));
      });
    }
    const looks = ids.length >= 2 ? buildLooks(ids) : [];
    const h = document.createElement('h3'); h.className = 'sec-title'; h.textContent = 'Looks pour toi'; pane.appendChild(h);
    if (!looks.length) {
      const e = document.createElement('p'); e.className = 'empty'; e.style.textAlign = 'left';
      e.textContent = ids.length < 2 ? 'Mets au moins 2 articles en Go : on te propose ensuite des tenues avec tes envies.' : 'Mets un haut, un bas ou une veste en Go pour obtenir des tenues.';
      pane.appendChild(e);
    }
    looks.forEach((L, k) => {
      const total = L.look.reduce((s, id) => s + Math.min(...curColor(id).p), 0);
      const already = savedLooks.some(l => lookKey(l.items) === lookKey(L.look.map(id => ({ id }))));
      pane.appendChild(lookCard(`${STYLE[L.tag][0]}`, L.look, total, already ? 'Enregistré' : 'Enregistrer', already ? null : (btn) => saveLook(L.look, btn)));
    });
  }
  function lookCard(title, ids, total, action, onAction) {
    const el = document.createElement('div'); el.className = 'look';
    el.innerHTML = `<div class="look-head"><strong>${esc(title)}</strong><span>${ids.length} pièces · ${eur(total)}</span></div>`;
    const row = document.createElement('div'); row.className = 'look-row'; ids.forEach(id => row.appendChild(thumbBtn(id))); el.appendChild(row);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pill' + (onAction && action === 'Enregistrer' ? ' dark' : ''); b.textContent = action; b.style.alignSelf = 'flex-start';
    if (onAction) b.onclick = () => onAction(b); else b.disabled = true;
    el.appendChild(b); return el;
  }

  // ---------- Looks enregistrés (sur cet appareil) ----------
  const LOOKS_KEY = 'craquage-looks-v1';
  let savedLooks = (store.get(LOOKS_KEY) || []).filter(l => Array.isArray(l.items));
  const lookKey = items => items.map(x => x.id).sort().join('|');
  function saveLook(ids) {
    const items = ids.map(id => ({ id, k: colorIdx(id) })), key = lookKey(items);
    if (!savedLooks.some(l => lookKey(l.items) === key)) { savedLooks.unshift({ items, at: Date.now() }); store.set(LOOKS_KEY, savedLooks); }
    flash('Look enregistré'); renderStyles();
  }

  // ---------- Fiche article ----------
  let sheetId = null, toastTimer = null;
  function fillSheet() {
    const id = sheetId, p = byId.get(id), c = curColor(id);
    const g = $('sheet-gallery'), dots = $('sheet-dots'), list = photosOf(c); g.innerHTML = ''; dots.hidden = list.length < 2;
    list.forEach((n, j) => { const im = document.createElement('img'); im.alt = `${p.n}, ${c.c}, vue ${j + 1}`; im.loading = j < 2 ? 'eager' : 'lazy';
      im.onerror = () => { badPhoto.add(c.i + '_' + n); im.remove(); }; im.src = IMG + c.i + '_hd' + n + '.jpg'; g.appendChild(im); });
    dots.innerHTML = list.length > 1 ? list.map((_, j) => `<i class="${j ? '' : 'on'}"></i>`).join('') : '';
    g.scrollLeft = 0;
    g.onscroll = () => { const w = g.clientWidth || 1, k = Math.round(g.scrollLeft / w);
      dots.querySelectorAll('i').forEach((d, j) => d.classList.toggle('on', j === k)); if (k > 0 && !g.dataset.learned) { g.dataset.learned = 1; learn(id, .08); } };
    delete g.dataset.learned;
    $('sheet-title').textContent = p.n;
    $('sheet-price').innerHTML = priceHtml(c); $('sheet-price').className = 'price' + (discount(c) ? ' is-promo' : '');
    $('sheet-buy').href = c.u;
    $('sheet-colour').innerHTML = `Couleur <b>${esc(c.c)}</b>`;
    const like = $('sheet-like'); like.classList.toggle('liked', verdicts[id] === 'yes'); like.setAttribute('aria-label', verdicts[id] === 'yes' ? 'Retirer de mes envies' : 'Ajouter à mes envies');
    const sw = $('sheet-sw'); sw.innerHTML = ''; sw.hidden = p.c.length < 2;
    p.c.forEach((cc, k) => {            // vignettes des couleurs, comme sur la fiche produit Kiabi
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Couleur ' + cc.c); b.setAttribute('aria-pressed', String(k === colorIdx(id)));
      b.innerHTML = '<img alt="" loading="lazy">'; b.querySelector('img').src = photo(cc, 'fr', 0);
      b.onclick = () => { chosen[id] = k; learn(id, .1); save(); fillSheet(); if (!$('coll').hidden) { renderColl(); if (!$('pane-styles').hidden) renderStyles(); } };
      sw.appendChild(b);
    });
  }
  function openSheet(id) { hideToast(); sheetId = id; fillSheet(); $('sheet').scrollTop = 0; $('sheet').hidden = false; $('sheet-close').focus(); }
  function closeSheet() { $('sheet').hidden = true; sheetId = null; }
  $('sheet-close').onclick = closeSheet;
  $('sheet-buy').addEventListener('click', () => sheetId && learn(sheetId, 1.5));
  $('toast-buy').addEventListener('click', () => { const id = history.length && history[history.length - 1].id; if (id) learn(id, 1.5); });
  $('sheet-share').onclick = () => sheetId && share(sheetId);
  $('sheet-like').onclick = () => {     // cœur de la fiche : ajoute ou retire des envies
    const id = sheetId; if (!id) return;
    if (verdicts[id] === 'yes') { verdicts[id] = 'no'; learn(id, -.4); flash('Retiré de tes envies'); }
    else { verdicts[id] = 'yes'; history.push({ id, choice: 'yes' }); learn(id, 1); flash('Ajouté à tes envies'); }
    fillSheet(); if (!$('coll').hidden) { renderColl(); if (!$('pane-styles').hidden) renderStyles(); }
    render();
  };
  function showToast(id) {
    clearTimeout(toastTimer);
    const img = $('toast-img'); img.hidden = false; setPhoto(img, id, 'fr');
    $('toast-text').textContent = 'Ajouté à tes envies'; $('toast-buy').hidden = false; $('toast-buy').href = curColor(id).u;
    $('toast').hidden = false; toastTimer = setTimeout(hideToast, 3500);
  }
  function hideToast() { clearTimeout(toastTimer); $('toast').hidden = true; }

  // ---------- Démarrage ----------
  fetch('data/products.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    PRODUCTS = data.products; byId = new Map(PRODUCTS.map(p => [p.id, p]));
    const st = store.get(KEY);
    const all = shuffle(PRODUCTS.map(p => p.id));
    if (st && Array.isArray(st.order)) {
      const kept = st.order.filter(id => byId.has(id)), seen = new Set(kept);
      order = kept.concat(all.filter(id => !seen.has(id)));                 // les nouveautés rejoignent la pile
      Object.entries(st.verdicts || {}).forEach(([id, v]) => { if (byId.has(id) && (v === 'yes' || v === 'no')) verdicts[id] = v; });
      Object.entries(st.chosen || {}).forEach(([id, k]) => { if (byId.has(id) && Number.isInteger(k)) chosen[id] = k; });
      history = (st.history || []).filter(h => h && byId.has(h.id));
      if (CATS.some(c => c[0] === st.cat)) cat = st.cat;
    } else order = all;
    $('loading').hidden = true; render();
  }).catch(() => { $('loading').hidden = true; $('error').hidden = false; });

  // pas de zoom : pincement et double-tap bloqués (Safari ignore la balise viewport)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastTouch = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 320 && !e.target.closest('input, textarea')) e.preventDefault(); lastTouch = now; }, { passive: false });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>

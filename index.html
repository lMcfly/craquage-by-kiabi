<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Craquage by Kiabi</title>
<meta name="description" content="Swipe les articles Kiabi : Go ou No go, change de couleur, garde tes coups de cœur et achète en un clic.">
<meta name="theme-color" content="#040037">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Craquage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.kiabi.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/app.css">
<link rel="stylesheet" href="src/styles/splash.css">
</head>
<body>

<div class="splash" id="splash" role="img" aria-label="Craquage by Kiabi">
  <div class="splash-inner" id="splash-inner">
    <div class="word" id="word" aria-hidden="true"></div>
    <div class="by"><span>by</span><img src="assets/brand/kiabi-k-white.svg" alt=""></div>
  </div>
  <div class="skip" data-i18n="skip"></div>
</div>

<div class="app">
  <header>
    <span class="hside" aria-hidden="true"></span>
    <a class="brand" href="./" aria-label="Craquage by Kiabi"><b>Craquage</b><span>by</span><img class="k-day" src="assets/brand/kiabi-k.svg" alt="Kiabi"><img class="k-night" src="assets/brand/kiabi-k-white.svg" alt="Kiabi"></a>
    <button class="gear glass hside" id="gear" type="button" data-i18n-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>
  <div class="catbar"><button class="catbtn" id="catbtn" type="button" aria-haspopup="dialog"><span id="catlabel">Tout</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>

  <section class="state" id="loading">
    <h2 data-i18n="loading"></h2>
    <p data-i18n="loading_txt"></p>
  </section>
  <section class="state" id="error" hidden>
    <h2 data-i18n="offline"></h2>
    <p data-i18n="offline_txt"></p>
    <div class="stack"><button class="btn primary" type="button" onclick="location.reload()" data-i18n="retry"></button></div>
  </section>

  <section id="swipe-view" style="display:none">
    <div class="stage"><div class="deck" id="deck"></div></div>
    <div class="controls">
      <button class="verdict no glass" id="btn-no" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>No go</span>
      </button>
      <button class="undo glass" id="btn-undo" type="button" data-i18n-aria="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="verdict yes" id="btn-yes" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg><span>Go</span>
      </button>
    </div>
  </section>

  <section class="state" id="end" hidden>
    <h2 id="end-title">Tu as tout vu !</h2>
    <p id="end-text"></p>
    <div class="stack">
      <button class="btn primary" id="end-coll" type="button" data-i18n="see_wishlist"></button>
      <button class="btn ghost" id="end-restart" type="button" data-i18n="replay_no"></button>
      <button class="btn link" id="end-all" type="button" hidden data-i18n="all_cats"></button>
    </div>
  </section>
</div>

<div class="coll" id="coll" hidden>
  <div class="coll-inner">
    <div class="coll-head"><h2 id="coll-title">Mes envies</h2><span class="n" id="coll-n"></span></div>
    <div class="coll-body" id="pane-items"><div class="grid" id="coll-grid"></div></div>
    <div class="coll-body" id="pane-styles" hidden></div>
  </div>
</div>

<nav class="tabbar glass" aria-label="Navigation">
  <button type="button" id="nav-swipe" aria-current="page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3.5"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5" stroke-linecap="round"/></svg><span data-i18n="tab_swipe"></span></button>
  <button type="button" id="nav-items"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg><span data-i18n="tab_wish"></span><span class="badge" id="coll-count" hidden>0</span></button>
  <button type="button" id="nav-styles"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span data-i18n="tab_style"></span></button>
</nav>

<div class="catsheet" id="catsheet" hidden><div class="catpanel" role="dialog" aria-modal="true" aria-labelledby="cat-title"><div class="grab"></div><h3 id="cat-title" data-i18n="i_want"></h3><div class="cattiles" id="cattiles"></div></div></div>

<div class="catsheet" id="welcome" hidden><div class="catpanel" role="dialog" aria-modal="true" aria-labelledby="wel-title"><div class="grab"></div>
  <h3 id="wel-title" data-i18n="welcome"></h3><p class="wel-txt" data-i18n="welcome_txt"></p>
  <div class="setgroup"><h4 data-i18n="clothes_size"></h4><div class="chips" id="wel-sizes"></div></div>
  <div class="setgroup"><h4 data-i18n="bottoms_size"></h4><div class="chips" id="wel-bottoms"></div></div>
  <div class="setgroup"><h4 data-i18n="shoe_size"></h4><div class="chips shoes" id="wel-shoes"></div></div>
  <div class="stack"><button class="btn primary" type="button" id="wel-go" data-i18n="lets_go"></button><button class="btn link" type="button" id="wel-skip" data-i18n="skip_step"></button></div>
</div></div>

<div class="catsheet" id="setsheet" hidden><div class="catpanel" role="dialog" aria-modal="true" aria-labelledby="set-title"><div class="grab"></div><h3 id="set-title" data-i18n="settings"></h3>
  <div class="setgroup"><h4 data-i18n="my_info"></h4><div class="account">
    <p class="lbl" data-i18n="clothes_size"></p><div class="chips" id="set-sizes"></div>
    <p class="lbl" data-i18n="bottoms_size"></p><div class="chips" id="set-bottoms"></div>
    <p class="lbl" data-i18n="shoe_size"></p><div class="chips shoes" id="set-shoes"></div>
    <label class="switch"><input type="checkbox" id="set-only"><span data-i18n="only_mine"></span></label>
    <p class="note" data-i18n="info_txt"></p>
  </div></div>
  <div class="setgroup" id="set-install"><h4 data-i18n="shortcut"></h4>
    <div class="install"><img src="assets/icons/icon-192.png" alt=""><p data-i18n="shortcut_txt"></p><button class="btn primary" type="button" id="install-btn" data-i18n="add"></button></div>
    <ol class="steps" id="install-steps" hidden></ol></div>
  <div class="setgroup"><h4 data-i18n="appearance"></h4><div class="seg three" id="set-theme">
    <button type="button" data-v="auto" data-i18n="th_auto"></button><button type="button" data-v="light" data-i18n="th_light"></button><button type="button" data-v="dark" data-i18n="th_dark"></button></div></div>
  <div class="setgroup"><h4 data-i18n="language"></h4><div class="seg two" id="set-lang">
    <button type="button" data-v="fr">Français</button><button type="button" data-v="en">English</button><button type="button" data-v="es">Español</button><button type="button" data-v="de">Deutsch</button></div></div>
  <div class="setgroup"><h4 data-i18n="account"></h4><div class="account">
    <p data-i18n="account_txt"></p>
    <button class="btn danger" type="button" id="wipe" data-i18n="wipe"></button>
    <div id="wipe-confirm" hidden style="display:flex;flex-direction:column;gap:8px"><p data-i18n="wipe_q" style="color:var(--ink);font-weight:600"></p>
      <button class="btn danger full" type="button" id="wipe-yes" data-i18n="wipe_yes"></button><button class="btn link" type="button" id="wipe-no" data-i18n="cancel"></button></div>
  </div></div>
</div></div>

<div class="toast glass" id="toast" hidden role="status"><img id="toast-img" alt=""><span id="toast-text"></span><a id="toast-buy" href="#" target="_blank" rel="noopener" data-i18n="buy"></a></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-top">
    <div class="gallery" id="sheet-gallery" aria-label="Photos de l’article"></div>
    <div class="gdots glass" id="sheet-dots" aria-hidden="true"></div>
    <button class="sheet-back glass" id="sheet-close" type="button" data-i18n-aria="back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="sheet-tools glass">
      <button id="sheet-share" type="button" data-i18n-aria="share"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></button>
      <button id="sheet-like" type="button" data-i18n-aria="add_wish"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg></button>
    </div>
  </div>
  <div class="sheet-body">
    <div class="cthumbs" id="sheet-sw" role="group" aria-label="Couleurs"></div>
    <p class="sheet-colour" id="sheet-colour"></p>
    <p class="sheet-sizes" id="sheet-sizes" hidden></p>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <div class="price" id="sheet-price"></div>
    <a class="btn primary" id="sheet-buy" href="#" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 01-1.5 1.3H7.7a1.5 1.5 0 01-1.5-1.3L5 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg><span data-i18n="buy_on"></span></a>
  </div>
</div>

<script type="module" src="src/js/app.js"></script>
</body>
</html>
